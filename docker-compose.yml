name: torfun

services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      MONGODB_URI: mongodb://mongodb:27017/torfun
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      # Required by config/env.ts. Set these in the repo-root .env — the api
      # container exits on startup otherwise, naming the missing field.
      # Deliberately not `${VAR:?...}`: that form aborts interpolation for the
      # whole file, which would break `docker compose up mongodb` on its own.
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-http://localhost:8080/api/auth/google/callback}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      EGP_API_KEY: ${EGP_API_KEY}
      # Optional, schema-defaulted.
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-asia-southeast3}
      VERTEX_AI_MODEL: ${VERTEX_AI_MODEL:-gemini-3.5-flash}
      EGP_MAX_DOWNLOADS_PER_RUN: ${EGP_MAX_DOWNLOADS_PER_RUN:-15}
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - api

volumes:
  mongodb_data:
  mongodb_config:

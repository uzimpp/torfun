<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:1415px;height:850px;background:#FFFFFF;" width="1415.625px" height="850px" viewBox="0 0 1415 850" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="588.604" y="54.456" fill="#000" font-size="25" textLength="235.803" font-weight="700" font-family="DejaVu Sans">How a Run stops</text></g><ellipse cx="707.163" cy="100.977" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/><rect x="551.852" y="147.852" width="310.623" height="53.076" fill="#F2F6FC" style="stroke:#4A6FA5;stroke-width:0.781;" rx="6.25" ry="6.25"/><text x="567.477" y="180.881" fill="#000" font-size="18.75" textLength="279.373" font-family="DejaVu Sans">Run works through the queue</text><polygon points="598.124,232.178,816.203,232.178,834.953,250.928,816.203,269.678,598.124,269.678,579.374,250.928,598.124,232.178" fill="#FFF4D6" style="stroke:#B8860B;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="598.124" y="257.419" fill="#000" font-size="18.75" textLength="218.079" font-family="DejaVu Sans">A stop condition holds?</text><text x="546.973" y="246.506" fill="#000" font-size="18.75" textLength="32.401" font-family="DejaVu Sans">yes</text><text x="834.953" y="246.506" fill="#000" font-size="18.75" textLength="23.355" font-family="DejaVu Sans">no</text><path d="M435.67,285.303 L435.67,341.431 L404.42,347.681 L435.67,353.931 L435.67,410.059 A0,0 0 0 0 435.67,410.059 L846.77,410.059 A0,0 0 0 0 846.77,410.059 L846.77,300.928 L831.145,285.303 L435.67,285.303 A0,0 0 0 0 435.67,285.303" style="stroke:#B8A04A;stroke-width:0.781;" fill="#FFF8DC"/><path d="M831.145,285.303 L831.145,300.928 L846.77,300.928 L831.145,285.303" style="stroke:#B8A04A;stroke-width:0.781;" fill="#FFF8DC"/><text x="445.045" y="310.519" fill="#000" font-size="18.75" textLength="293.051" font-family="DejaVu Sans">429 or 403 from e-GP (latched)</text><text x="445.045" y="332.346" fill="#000" font-size="18.75" textLength="301.208" font-family="DejaVu Sans">3 requests in a row unanswered</text><text x="445.045" y="354.172" fill="#000" font-size="18.75" textLength="378.287" font-family="DejaVu Sans">A web page instead of data (site closed)</text><text x="445.045" y="375.998" fill="#000" font-size="18.75" textLength="174.6" font-family="DejaVu Sans">Administrator stop</text><text x="445.045" y="397.824" fill="#000" font-size="18.75" textLength="312.625" font-family="DejaVu Sans">Lease taken over by another Run</text><rect x="161.327" y="321.143" width="243.094" height="53.076" fill="#F2F6FC" style="stroke:#4A6FA5;stroke-width:0.781;" rx="6.25" ry="6.25"/><text x="176.952" y="354.172" fill="#000" font-size="18.75" textLength="211.844" font-family="DejaVu Sans">Gate latched or closed</text><rect x="25" y="441.309" width="515.747" height="96.729" fill="#F2F6FC" style="stroke:#4A6FA5;stroke-width:0.781;" rx="6.25" ry="6.25"/><text x="40.625" y="474.338" fill="#000" font-size="18.75" textLength="273.376" font-family="DejaVu Sans">No new request goes to e-GP</text><text x="40.625" y="496.164" fill="#000" font-size="18.75" textLength="286.469" font-family="DejaVu Sans">Nothing new leaves the queue</text><text x="40.625" y="517.99" fill="#000" font-size="18.75" textLength="484.497" font-family="DejaVu Sans">Queued projects keep their state, no attempt spent</text><rect x="53.313" y="569.287" width="459.122" height="53.076" fill="#F2F6FC" style="stroke:#4A6FA5;stroke-width:0.781;" rx="6.25" ry="6.25"/><text x="68.938" y="602.316" fill="#000" font-size="18.75" textLength="427.872" font-family="DejaVu Sans">Analysis finishes the archives it already holds</text><rect x="878.02" y="285.303" width="506.866" height="74.902" fill="#F2F6FC" style="stroke:#4A6FA5;stroke-width:0.781;" rx="6.25" ry="6.25"/><text x="893.645" y="318.332" fill="#000" font-size="18.75" textLength="310.052" font-family="DejaVu Sans">Continue until Discovery is done,</text><text x="893.645" y="340.158" fill="#000" font-size="18.75" textLength="475.616" font-family="DejaVu Sans">the queue is empty and every Analysis has settled</text><polygon points="707.163,631.738,725.913,650.488,707.163,669.238,688.413,650.488,707.163,631.738" fill="#FFF4D6" style="stroke:#B8860B;stroke-width:0.781;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="647.616" y="700.488" width="119.095" height="53.076" fill="#F2F6FC" style="stroke:#4A6FA5;stroke-width:0.781;" rx="6.25" ry="6.25"/><text x="663.241" y="733.517" fill="#000" font-size="18.75" textLength="87.845" font-family="DejaVu Sans">Run ends</text><ellipse cx="707.163" cy="802.002" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="707.163" cy="802.002" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/><line x1="707.163" y1="116.602" x2="707.163" y2="147.852" style="stroke:#44546A;stroke-width:1.563;"/><polygon points="700.913,132.227,707.163,147.852,713.413,132.227,707.163,138.477" fill="#44546A" style="stroke:#44546A;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="282.874" y1="374.219" x2="282.874" y2="441.309" style="stroke:#44546A;stroke-width:1.563;"/><polygon points="276.624,425.684,282.874,441.309,289.124,425.684,282.874,431.934" fill="#44546A" style="stroke:#44546A;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="282.874" y1="538.037" x2="282.874" y2="569.287" style="stroke:#44546A;stroke-width:1.563;"/><polygon points="276.624,553.662,282.874,569.287,289.124,553.662,282.874,559.912" fill="#44546A" style="stroke:#44546A;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="579.374" y1="250.928" x2="282.874" y2="250.928" style="stroke:#44546A;stroke-width:1.563;"/><line x1="282.874" y1="250.928" x
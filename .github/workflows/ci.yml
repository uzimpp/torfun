name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          # Dummy values so build-time env validation passes; real secrets are
          # injected at deploy/runtime, never baked into the CI build.
          MONGODB_URI: mongodb://localhost:27017/torfun-ci
          JWT_SECRET: ci-build-secret-ci-build-secret-1234
          GOOGLE_CLOUD_PROJECT: torfun-ci

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Build web
        run: bunx turbo build --filter=@torfun/web
        env:
          MONGODB_URI: mongodb://localhost:27017/torfun-ci
          JWT_SECRET: ci-build-secret-ci-build-secret-1234
          GOOGLE_CLOUD_PROJECT: torfun-ci

      - name: Run Playwright e2e tests
        run: bun run test:e2e
        working-directory: apps/web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

name: Security

on:
  pull_request:
    branches: [develop, main]
    # `labeled` lets a reviewer add the `dast` label to any PR to run the image
    # scan and ZAP against it on demand (assignment criterion 15, issue #191).
    types: [opened, synchronize, reopened, labeled]
  # Code-scanning alerts belong to a ref. A PR scan reports on refs/pull/N/merge,
  # so it can never close an alert on `main`: without a scan of the branch itself,
  # an alert opened by one weekly run stays open after the fix merges. Only the
  # jobs that upload SARIF (sast, container-scan) run on push; the others only
  # pass or fail, so they have no stale state to refresh.
  push:
    branches: [develop, main]
  # Runs every job, like the weekly schedule. Use it to re-scan a branch on demand.
  workflow_dispatch:
  schedule:
    # Catch newly-disclosed CVEs in unchanged dependencies.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      # OWASP A06 (vulnerable & outdated components). bun audit reads only the lockfile.
      # The weekly run audits everything at high and above. A PR fails on any
      # critical advisory, even one already on the base branch, so a known critical
      # keeps every PR red until it is fixed (#204, R-14); for high it fails only
      # on advisories the PR introduces.
      - name: Test the PR advisory gate
        if: github.event_name == 'pull_request'
        run: bun test ./.github/scripts/new-advisories.test.ts
      - name: bun audit
        if: github.event_name != 'pull_request'
        run: bun audit --audit-level=high
      - name: bun audit (any critical, or new high in this PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/base" && bun audit --json > "$RUNNER_TEMP/base.json") || true
          bun audit --json > "$RUNNER_TEMP/head.json" || true
          bun .github/scripts/new-advisories.ts "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" high critical

  secret-scan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # OWASP A02 (cryptographic failures / leaked credentials).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3

  container-scan:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.base.ref == 'main' ||
      contains(github.event.pull_request.labels.*.name, 'dast')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build ${{ matrix.app }} image
        run: docker build -f apps/${{ matrix.app }}/Dockerfile -t torfun-${{ matrix.app }}:ci .
      # OWASP A06, plus OS-level CVEs in the base image.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: torfun-${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
      - uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}

  dast-zap-baseline:
    # Runs after the image scan but not only when it passes: a Trivy finding
    # must not also hide the ZAP results, which test different things.
    if: >-
      !cancelled() && github.event_name != 'push' && (
      github.event_name != 'pull_request' ||
      github.event.pull_request.base.ref == 'main' ||
      contains(github.event.pull_request.labels.*.name, 'dast'))
    runs-on: ubuntu-latest
    needs: [container-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      # apps/api/.env is gitignored and docker-compose.yml's `env_file` for the
      # api service is required (unlike web's), so `docker compose up` fails
      # fast with "env file ... not found" on a bare checkout. Render it from
      # the same schema-valid fake config the test suite uses (testEnv() in
      # src/testing/env.ts), so a future required field flows into this job
      # automatically instead of needing a second, hand-maintained env block
      # that quietly drifts from config/env.ts's zod schema.
      - name: Create apps/api/.env for the ephemeral stack
        run: bun run print-test-env > .env
        working-directory: apps/api
      - name: Start stack
        run: docker compose up --build -d web api mongodb
      - name: Wait for web to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && exit 0
            sleep 2
          done
          echo "web did not become ready in time" >&2
          exit 1
      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 2
          done
          echo "api did not become ready in time" >&2
          exit 1
      # OWASP DAST pass against the running app (XSS, headers, injection probes).
      # Each scan uploads its HTML/JSON/Markdown report as a workflow artifact,
      # which is the evidence kept for the report.
      - name: OWASP ZAP baseline scan (web)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-web
      - name: OWASP ZAP baseline scan (API)
        if: always()
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8080/api/health'
          cmd_options: '-a'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-api
      - name: Stop stack
        if: always()
        run: docker compose down -v
